name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  # One group per PR (superseded runs are cancelled) and one per commit on main (never cancelled).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read # paths-filter lists a PR's changed files through the REST API
    outputs:
      # Pushes to main run every gated job.
      workflows: ${{ github.event_name != 'pull_request' || steps.filter.outputs.workflows == 'true' }}
      spec: ${{ github.event_name != 'pull_request' || steps.filter.outputs.spec == 'true' }}
    steps:
      - name: Detect changed areas
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'
              # zizmor also audits dependabot.yml, and both linters read a config file.
              - '.github/*.{yml,yaml}'
              - 'zizmor.{yml,yaml}'
            spec:
              - 'spec/**'
              # Dependency, toolchain and workflow changes can break the spec tools without touching spec/.
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.nvmrc'
              - '.github/workflows/ci.yml'

  # Not gated: a change anywhere can break a path that AGENTS.md or CLAUDE.md points to.
  instructions:
    name: instructions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # The repository checkout cleans the workspace, so it must come first.
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out instruction-keeper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 92khsang/instruction-keeper
          ref: 279049f608928ed6dc9684e962c7205365b5a3b5 # v0.2.1
          path: .ik
          persist-credentials: false
      - name: Check AGENTS.md and CLAUDE.md
        run: |
          python3 -I -B .ik/scripts/check_instructions.py --project-root . || true
          rc=0
          python3 -I -B .ik/scripts/check_instructions.py --project-root . --json \
            > "${RUNNER_TEMP}/ik.json" || rc=$?
          # Exit 1 only reports failing findings, which the gate below handles; 2 means the checker broke.
          if [ "${rc}" -ge 2 ]; then
            echo "::error::instruction checker could not run (exit ${rc})"
            exit "${rc}"
          fi
          python3 -I - "${RUNNER_TEMP}/ik.json" <<'PY'
          import json
          import sys

          def escape(text):
              return str(text).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          # Warnings fail the job too; only info findings pass.
          bad = [f for f in report["findings"] if f["severity"] != "info"]
          for f in bad:
              location = escape(f["file"]).replace(":", "%3A").replace(",", "%2C")
              print(f"::error file={location},line={f.get('line') or 1}::[{escape(f['code'])}] {escape(f['message'])}")
          sys.exit(1 if bad else 0)
          PY

  workflows:
    name: workflows
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      # sha256 of actionlint_1.7.12_linux_amd64.tar.gz from the release's checksums.txt
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
      - name: actionlint
        run: |
          # actionlint skips its shell checks without a word when shellcheck is missing.
          shellcheck --version
          "${RUNNER_TEMP}/actionlint" -color
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # SARIF upload mode always exits 0; annotation mode fails the job on any finding.
          advanced-security: false
          annotations: true

  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm format:check

  # Needs no IDE: check-ids reads the ID snapshots committed under spec/ids/.
  spec:
    name: spec
    needs: changes
    if: needs.changes.outputs.spec == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Node runs the .mts tools by stripping types without checking them.
      - name: Type-check
        run: pnpm typecheck
      - name: Validate the catalog
        run: pnpm spec:check
      - name: Check command and action IDs
        run: pnpm check-ids
      - name: Check that spec/generated matches the catalog
        run: pnpm gen --check
      # Goldens are compared with update "none", so a missing or changed golden fails here.
      - name: Test with the coverage floor
        run: pnpm test --coverage

  # The squash dialog lets a merger edit the title, so check the subject that actually landed.
  title-on-main:
    name: title-on-main
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # As in pr-title: the whole subject for its length, then without " (#N)" for the other rules.
      - name: Lint the merged commit subject
        run: |
          subject=$(git log -1 --format=%s "${GITHUB_SHA}")
          printf '%s\n' "${subject}" | pnpm exec commitlint --verbose
          printf '%s\n' "${subject}" | sed -E 's/ \(#[0-9]+\)$//' | pnpm exec commitlint --verbose

  ci-ok:
    name: ci-ok
    # A job whose needs failed is skipped, and a skipped required check counts as passing, so this
    # job must always run and report the real outcome.
    if: always()
    needs:
      - changes
      - instructions
      - workflows
      - format
      - title-on-main
      - spec
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check that every needed job succeeded
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: workflows, title-on-main, spec
          jobs: ${{ toJSON(needs) }}
