[org/gnome/desktop/input-sources]
sources=[('ibus', 'hangul')]
mru-sources=[('ibus', 'hangul')]
per-window=false
xkb-options=@as []

[org/freedesktop/ibus/engine/hangul]
hangul-keyboard='2'
initial-input-mode='latin'
switch-keys='Shift+space'
off-keys='Escape'
word-commit=false
preedit-mode='syllable'
auto-reorder=false

[org/gnome/desktop/session]
idle-delay=uint32 0

[org/gnome/desktop/screensaver]
lock-enabled=false
idle-activation-enabled=false

[org/gnome/desktop/notifications]
show-banners=false

[org/gnome/shell]
enabled-extensions=['s1-harness@vimcompanion.spike']
disable-user-extensions=false
